name = "a-day-in-ireland-api"
main = "platform/cloudflare-entry.js"
compatibility_date = "2026-07-25"
workers_dev = true

[limits]
cpu_ms = 1000
subrequests = 100

routes = [
  { pattern = "day.illek.ie", custom_domain = true }
]

[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "HISTORY_DB"
database_name = "a-day-in-ireland-history"
database_id = "499aadb0-e1be-470a-848b-1874fa71818a"
migrations_dir = "migrations"

[vars]
EDGE_RUNTIME = "cloudflare"
PAGES_ORIGIN = "https://a-day-in-ireland.pages.dev"
# NTA_API_KEY is a Wrangler secret, not a [vars] value.

[[durable_objects.bindings]]
name = "NTA_FEED"
class_name = "NtaFeedCoordinator"

[[durable_objects.bindings]]
name = "RIVER_FEED"
class_name = "RiverFeedCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NtaFeedCoordinator"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RiverFeedCoordinator"]

[browser]
binding = "BROWSER"
