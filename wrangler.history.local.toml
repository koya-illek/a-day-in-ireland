name = "a-day-in-ireland-history-local"
main = "platform/cloudflare-entry.js"
compatibility_date = "2026-07-25"

[limits]
cpu_ms = 1000
subrequests = 100

[vars]
EDGE_RUNTIME = "cloudflare"
PAGES_ORIGIN = "https://a-day-in-ireland.pages.dev"

[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "HISTORY_DB"
database_name = "a-day-in-ireland-history-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "NTA_FEED"
class_name = "NtaFeedCoordinator"

[[durable_objects.bindings]]
name = "RIVER_FEED"
class_name = "RiverFeedCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NtaFeedCoordinator"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RiverFeedCoordinator"]

[browser]
binding = "BROWSER"
